name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      TRIAGELENS_TEST_POSTGRES_DSN: postgresql://postgres:ci@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements*.txt
      - run: python -m pip install -r requirements-postgres.txt -r requirements-yara.txt -r requirements-dev.txt
      - name: Lint correctness checks
        run: ruff check --select E9,F63,F7,F82 src tests
      # The rest of src has existing mypy errors; expand the gate as they are fixed.
      - name: Type check initial model scope
        run: mypy --python-version 3.13 --follow-imports=silent --ignore-missing-imports src/models/alert.py src/models/enrichment.py src/models/timeline.py
      - name: Backend tests (SQLite and PostgreSQL)
        run: python -m pytest -q --tb=short
      - name: Audit Python dependencies
        run: |
          pip-audit -r requirements-postgres.txt --progress-spinner off
          pip-audit -r requirements-yara.txt --progress-spinner off
      - name: Scan backend security issues
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          report = Path(os.environ['RUNNER_TEMP']) / 'bandit.json'
          result = subprocess.run(['bandit', '-r', 'src', '-f', 'json', '-o', str(report)], capture_output=True, text=True)
          if result.returncode not in (0, 1) or not report.is_file():
              raise SystemExit('Bandit failed to produce a report')
          data = json.loads(report.read_text(encoding='utf-8'))
          if data.get('errors'):
              raise SystemExit(f"Bandit skipped {len(data['errors'])} file(s)")
          findings = data['results']
          for issue in findings:
              print(f"{issue['issue_severity']} {issue['test_id']} {issue['filename']}:{issue['line_number']}")
          print(f"Bandit: {len(findings)} findings; high severity blocks CI; lower severities require review.")
          if any(issue['issue_severity'] == 'HIGH' for issue in findings):
              raise SystemExit(1)
          PY
      - name: Generate Python SBOMs
        run: |
          mkdir -p sbom
          cyclonedx-py requirements requirements-postgres.txt --of JSON -o sbom/python-postgres.json
          cyclonedx-py requirements requirements-yara.txt --of JSON -o sbom/python-yara.json
      - uses: actions/upload-artifact@v4
        with:
          name: python-sbom
          path: sbom/*.json
          if-no-files-found: error

  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Generate dashboard SBOM
        run: npm sbom --sbom-format=cyclonedx > dashboard-sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-sbom
          path: dashboard/dashboard-sbom.json
          if-no-files-found: error

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan Git history with redacted output
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo
          ghcr.io/gitleaks/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854
          git --no-banner --redact=100 /repo
